<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starfleet aCADemy — Gesture-Driven CAD</title>
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <link rel="apple-touch-icon" href="/src/assets/logo.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- Top toolbar: camera toggle + scene utilities (mounted by src/ui/Toolbar.ts) -->
      <header id="toolbar"></header>

      <main id="workspace" class="workspace">
        <!-- 3D CAD viewport fills the entire workspace (Three.js) -->
        <section id="cad-panel" class="panel">
          <div id="viewport" class="viewport"></div>
        </section>

        <!-- Floating camera thumbnail (video-call style PiP):
             webcam feed + 2D gesture debug overlay, expandable on click.
             The card's outer frame (header + metrics bar) is the drag
             handle; the resize grip sits on the card's bottom-right corner,
             outside the video stage. -->
        <aside id="vision-thumb" class="vision-thumb">
          <div id="stage" class="stage">
            <video id="video" playsinline muted autoplay></video>
            <!-- 2D canvas overlay: landmarks, skeleton + in-vision UI. No WebGL. -->
            <canvas id="overlay"></canvas>
          </div>
          <div class="vision-thumb-header">
            <span id="status" class="status">Idle</span>
            <button
              id="thumb-expand"
              type="button"
              title="Expand camera thumbnail"
              aria-label="Expand camera thumbnail"
            >
              ⤢
            </button>
          </div>
          <!-- Live stats bar (mode / state / FPS / hands), mounted by
               src/ui/MetricsBar.ts directly underneath the camera view. -->
          <div id="metrics" class="metrics-bar"></div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
