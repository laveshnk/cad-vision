<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAD Vision — build with your hands and your voice</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- Top toolbar: camera toggle + scene utilities (mounted by src/ui/Toolbar.ts) -->
      <header id="toolbar"></header>

      <main id="workspace" class="workspace">
        <!-- 3D CAD viewport fills the entire workspace (Three.js) -->
        <section id="cad-panel" class="panel">
          <div id="viewport" class="viewport"></div>
          <!-- Voice captions: what was heard and what the agent said back
               (mounted by src/ui/VoiceHud.ts) -->
          <div id="voice-captions"></div>
        </section>

        <!-- Floating camera thumbnail (video-call style PiP):
             webcam feed + 2D gesture debug overlay, expandable on click -->
        <aside id="vision-thumb" class="vision-thumb">
          <div id="stage" class="stage">
            <video id="video" playsinline muted autoplay></video>
            <!-- 2D canvas overlay: landmarks, skeleton + HUD. No WebGL. -->
            <canvas id="overlay"></canvas>
          </div>
          <div class="vision-thumb-header">
            <span id="status" class="status">Idle</span>
            <!-- Voice state badge (mounted by src/ui/VoiceHud.ts) -->
            <span id="voice-pill" hidden></span>
            <button
              id="thumb-expand"
              type="button"
              title="Expand camera thumbnail"
              aria-label="Expand camera thumbnail"
            >
              ⤢
            </button>
          </div>
        </aside>
      </main>

      <footer class="footer">
        <p>
          Pinch with both hands and pull apart to size a shape, then drag one hand up to make it
          tall. Make a fist to grab the scene; two fists zoom and turn it. Turn on
          <strong>Voice</strong> and just say what you want — “give me a red tube”, “taller”,
          “undo that”. Export any time as <code>model.stl</code>.
        </p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
